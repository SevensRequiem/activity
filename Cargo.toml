[workspace]
resolver = "3"
members = ["crates/core", "crates/activity"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
activity-core = { path = "crates/core" }
anyhow = "1.0.104"
async-channel = "2.5.0"
async-executor = "1.14.1"
async-io = "2.6.0"
async-signal = "0.2.14"
clap = { version = "4.6.7", features = ["derive"] }
futures-lite = "2.6.1"
jiff = { version = "0.2.43", features = ["serde"] }
parking_lot = "0.12"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = "5.19.0"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
module_name_repetitions = "allow"
# Boilerplate doc sections and must_use on every getter; the conventions ban boilerplate docs.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
